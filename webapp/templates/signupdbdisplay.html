<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup Data</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="p-5">

<div class="container">
    <h2 class="text-center mb-4">Signup Data</h2>

    <table class="table table-bordered table-striped text-center table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Mobile</th>
            <th>Password</th>
            <th>Confirm</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        {% for u in data %}
        <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.Signup_username }}</td>
            <td>{{ u.Signup_email }}</td>
            <td>{{ u.Signup_mobile }}</td>
            <td>{{ u.Signup_password }}</td>
            <td>{{ u.Signup_confirm }}</td>

            <td>
                <a href="{% url 'DeleteSignup' u.id %}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Are you sure you want to delete this user?');">
                    Delete
                </a>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
