<!DOCTYPE html>
{% load static %}
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login Form</title>
    <link rel="stylesheet" href="{% static 'usersign/style.css' %}">
</head>
<body>
<div class="wrapper">
    <form action="{% url 'login' %}" method="post">
        {% csrf_token %}
        <h2>Login</h2>
        <div class="input-field">
            <input type="text" required name="signin_username">
            <label>Enter your Username</label>
        </div>
        <div class="input-field">
            <input type="password" required name="signin_password">
            <label>Enter your password</label>
        </div>
        <!--      <div class="forget">-->
        <!--        <label for="remember">-->
        <!--          <input type="checkbox" id="remember">-->
        <!--          <p>Remember me</p>-->
        <!--        </label>-->
        <!--        <a href="#">Forgot password?</a>-->
        <!--      </div>-->
        <button type="submit">Log In</button>
        <div class="register">
            <p>Don't have an account? <a href="{% url 'Usersignuppage' %}">Register</a></p>
        </div>
    </form>
</div>
<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
{% if messages %}
    {% for i in messages %}
        {% if 'success' in i.tags %}
            <script> swal('{{i}}', '', 'success'); </script>

        {% elif 'warning' in i.tags %}
            <script> swal('{{i}}', '', 'warning'); </script>

        {% elif 'info' in i.tags %}
            <script> swal('{{i}}', '', 'info'); </script>

        {% elif 'error' in i.tags %}
            <script> swal('{{i}}', '', 'error'); </script>

        {% endif %}
    {% endfor %}
{% endif %}
</body>
</html>
