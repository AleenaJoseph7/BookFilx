<!DOCTYPE html>
<html>
<head>
    <title>Checkout Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        table th, table td {
            vertical-align: middle !important;
        }
    </style>
</head>

<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4 text-center">Checkout Details</h2>

    <table class="table table-bordered table-hover shadow-sm bg-white">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Pincode</th>
            <th>Total Amount</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        {% for i in data %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ i.Fullname }}</td>
            <td>{{ i.Email }}</td>
            <td>{{ i.Phone }}</td>
            <td>{{ i.Address }}</td>
            <td>{{ i.Pincode }}</td>
            <td>₹ {{ i.Total_amount }}</td>

            <td>
                <a href="{% url 'DeleteCheckout' i.id %}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this record?')">
                    Delete
                </a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="8" class="text-center text-muted">No checkout records found.</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
