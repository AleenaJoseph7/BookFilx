{% extends 'index.html' %}
{% block content %}

<div class="card mb-5 mt-5"
     style="height:auto; width:auto; margin:auto; border:1px solid lightgrey; background: rgba(255,255,255,0.15);backdrop-filter: blur(10px);">
    <div class="card-body">
        <h1 class="text-center mb-5" style="color:darkblue; font-size:35px; font-weight:bold; font-family:Arial;">
            Book Registration
        </h1>
        <form action="{% url 'savebook' %}" method="post" enctype="multipart/form-data" name="myform" onsubmit="Validations()">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Book Title :</label>
                <input type="text" class="form-control" placeholder="Book Title" name="book_title" onkeyup="Validationbooktitle()">
                <small class="text-danger" id="err_booktitle"></small>
            </div>

            <div class="mb-3">
                <label class="form-label">Author :</label>
                <input type="text" class="form-control" placeholder="Author" name="book_author">
            </div>

            <div class="mb-3">
                <label class="form-label">Category :</label>
                <select class="form-control" name="book_category" required>
                    <option>Select Book Category</option>
                    {% for i in category %}
                    <option>{{i.Catergory_name}}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Price :</label>
                <input type="text" class="form-control" placeholder="Price" name="book_price">
            </div>

            <div class="mb-3">
                <label class="form-label">Publisher :</label>
                <input type="text" class="form-control" placeholder="Publisher" name="book_publisher">
            </div>

            <div class="mb-3">
                <label class="form-label">Description:</label>
                <textarea placeholder="Description" class="form-control" name="book_description"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Cover Image :</label>
                <input type="file" class="form-control" name="book_cover" required>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary mb-3 mt-3" style="width:250px;">Submit</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded',function(){
    const err_booktitle=document.getElementById('err_booktitle');

    window.Validationbooktitle=function(){
    err_booktitle.innerHTML=/^[A-Za-z\s-.]+$/.test(myform.book_title.value.trim())
    ? "" : "Please enter a Valid Book Title";
    }

    window.Validations=function(){
    Validationbooktitle();
    return document.querySelectorall('.text-danger:not(:empty)').length===0;
    }
    });
</script>
<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

{% if messages %}
{% for i in messages %}
{% if 'success' in i.tags %}
<script> swal('{{i}}', '', 'success'); </script>

{% elif 'warning' in i.tags %}
<script> swal('{{i}}', '', 'warning'); </script>

{% elif 'info' in i.tags %}
<script> swal('{{i}}', '', 'info'); </script>

{% elif 'error' in i.tags %}
<script> swal('{{i}}', '', 'error'); </script>

{% endif %}
{% endfor %}
{% endif %}

{% endblock %}
