{% extends 'index.html' %}
{% block content %}

<div class="card mb-5 mt-5" style="height:auto; width:auto; margin:auto; border:1px solid lightgrey;">
    <div class="card-body ">
        <h1 class="text-center mb-5" style="color:darkblue; font-size:35px; font-weight:bold; font-family:Arial;">
            Catergory Updation</h1>
        <form action="{% url 'updatecatergory' c_id=catergory.id %}" method="post" enctype="multipart/form-data" name="myform" onsubmit="Validations()">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Category Name :</label>
                <input type="text" class="form-control" placeholder="Catergory Name" name="catergory_name"
                       value="{{catergory.Catergory_name}}" onkeyup="Validationcat()">
                <small class="text-danger" id="error_cat"></small>
            </div>

            <div class="mb-3">
                <label class="form-label">Descritpion :</label>
                <textarea placeholder="Description" name="catergory_description" class="form-control" onkeyup="Validationdesc()">{{catergory.Catergory_description}}</textarea>
                <small class="text-danger" id="error_desc"></small>
            </div>

            <div class="mb-3">
                <label class="form-label">Cover Image :</label>
                <img src="{{catergory.Catergory_cover.url}}" height="150px" width="150px" class="mb-3">
                <input type="file" class="form-control" placeholder="Cover Image" name="catergory_cover">
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary mb-3 mt-3" style="width:250px;">Update</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded',function(){
        const error_cat=document.getElementById('error_cat');
        const error_desc=document.getElementById('error_desc');

        window.Validationcat=function(){
            error_cat.innerHTML=/^[A-Z][a-z]+$/.test(myform.catergory_name.value.trim())
            ? "" : "Please enter a valid Catergory Name";
        }
    });
</script>

<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
{% if messages %}
{% for i in messages %}
{% if 'success' in i.tags %}
<script> swal('{{i}}', '', 'success'); </script>

{% elif 'warning' in i.tags %}
<script> swal('{{i}}', '', 'warning'); </script>

{% elif 'info' in i.tags %}
<script> swal('{{i}}', '', 'info'); </script>

{% elif 'error' in i.tags %}
<script> swal('{{i}}', '', 'error'); </script>

{% endif %}
{% endfor %}
{% endif %}

{% endblock %}
