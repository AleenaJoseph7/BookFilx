{% extends 'index.html' %}
{% block content %}

<div class="card mb-5 mt-5" style="height:515px; width:auto; margin:auto; border:1px solid lightgrey;">
    <div class="card-body ">
        <h1 class="text-center mb-5" style="color:darkblue; font-size:35px; font-weight:bold; font-family:Arial;">
            Catergory Registration</h1>
        <form action="{% url 'savecatergory' %}" method="post" enctype="multipart/form-data" name="myform" onsubmit="Validations()">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Category Name :</label>
                <input type="text" class="form-control" placeholder="Catergory Name" name="catergory_name" onkeyup="Validationcat()">
                <small class="text-danger" id="error_cat"></small>
            </div>

            <div class="mb-3">
                <label class="form-label">Descritpion :</label>
                <textarea placeholder="Description" name="catergory_description" class="form-control" onkeyup="Validationdesc()"></textarea>
                <small class="text-danger" id="error_desc"></small>
            </div>

            <div class="mb-3">
                <label class="form-label">Cover Image :</label>
                <input type="file" class="form-control" placeholder="Cover Image" name="catergory_cover" required>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary mb-3 mt-3" style="width:250px;">Submit</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded',function(){
     const error_cat=document.getElementById('error_cat');
     const error_desc=document.getElementById('error_desc');

     window.Validationcat = function(){
        error_cat.innerHTML=/^[A-Z][A-Za-z ]+$/.test(myform.catergory_name.value.trim())
        ? "" : "Please enter a valid Catergory Name";
     }

     window.Validationdesc = function(){
        error_desc.innerHTML=/^[A-Za-z0-9 ,()-.]{5,}$/.test(myform.catergory_description.value.trim())
        ? "" : "Please enter a valid Catergory Description";
     }

     window.Validations = function(){
        Validationcat();
        Validationdesc();
        return document.querySelectorAll('.text-danger:not(:empty)').length===0;
     }
    });
</script>
<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

{% if messages %}
{% for i in messages %}
{% if 'success' in i.tags %}
<script> swal('{{i}}', '', 'success'); </script>

{% elif 'warning' in i.tags %}
<script> swal('{{i}}', '', 'warning'); </script>

{% elif 'info' in i.tags %}
<script> swal('{{i}}', '', 'info'); </script>

{% elif 'error' in i.tags %}
<script> swal('{{i}}', '', 'error'); </script>

{% endif %}
{% endfor %}
{% endif %}

{% endblock %}
