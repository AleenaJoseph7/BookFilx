<!DOCTYPE html>
<html lang="en">
{% extends 'index.html' %}
{% block content %}

<head>
    <meta charset="UTF-8">
    <title>Catergory Registration</title>
</head>

<body>
        <div class="card mb-5 mt-5" style="height:515px; width:auto; margin:auto; border:1px solid lightgrey;">
        <div class="card-body ">
            <h1 class="text-center mb-5" style="color:darkblue; font-size:35px; font-weight:bold; font-family:Arial;">
                Catergory Registration</h1>
            <form action="{% url 'savecatergory' %}" method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Category Name :</label>
                    <input type="text" class="form-control" placeholder="Catergory Name" name="catergory_name">
                </div>

                <div class="mb-3">
                    <label class="form-label">Descritpion :</label>
                    <textarea placeholder="Description" name="catergory_description" class="form-control"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Cover Image :</label>
                    <input type="file" class="form-control" placeholder="Cover Image" name="catergory_cover" required>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary mb-3 mt-3" style="width:250px;">Submit</button>
                </div>
            </form>
        </div>
    </div>
<script src=""></script>

{% if messages %}
        {% for i in messages %}
            {% if i.tags == 'success' %}
                <script>
                    swal('{{i}}','','success')
                </script>
            {% endif %}
        {% endfor %}
{% endif %}
</body>

</html>
{% endblock %}
