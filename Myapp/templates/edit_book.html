{% extends 'index.html' %}
{% block content %}

<div class="card mb-5 mt-5" style="height:auto; width:auto; margin:auto; border:1px solid lightgrey; ">
    <div class="card-body">
        <h1 class="text-center mb-5" style="color:darkblue; font-size:35px; font-weight:bold; font-family:Arial;">
            Book Updation
        </h1>
        <form action="{% url 'updatebook' b_id=book.id %}" method="post" enctype="multipart/form-data" name="myform"
              onsubmit="Validations()">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Book Title :</label>
                <input type="text" class="form-control" placeholder="Book Title" name="book_title"
                       value="{{book.Book_title}}" onkeyup="Validationbooktitle()">
                <small class="text-danger" id="err_bookauthor"></small>
            </div>

            <div class="mb-3">
                <label class="form-label">Author :</label>
                <input type="text" class="form-control" placeholder="Author" name="book_author"
                       value="{{book.Book_author}}" onkeyup="Validationbookauthor()">
                <small class="text-danger" id="err_bookauthor"></small>


            </div>

            <div class="mb-3">
                <label class="form-label">Category :</label>
                <select class="form-control" name="book_category">
                    <option>{{book.Book_category}}</option>
                    {% for i in category %}
                    <option>{{i.Catergory_name}}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Price :</label>
                <input type="text" class="form-control" placeholder="Price" name="book_price"
                       value="{{book.Book_price}}"  onkeyup="Validationbookprice()">
                <small class="text-danger" id="err_bookprice"></small>
            </div>

            <div class="mb-3">
                <label class="form-label">Publisher :</label>
                <input type="text" class="form-control" placeholder="Publisher" name="book_publisher"
                       value="{{book.Book_publisher}}"  onkeyup="Validationpublisher()">
            </div>

            <div class="mb-3">
                <label class="form-label">Description:</label>
                <textarea placeholder="Description" class="form-control" name="book_description">{{book.Book_description}}</textarea>
                <small class="text-danger" id="err_bookpublisher" onkeyup="Validationdescription()"></small>
            </div>

            <div class="mb-3">
                <label class="form-label">Cover Image :</label>
                <img src="{{book.Book_cover.url}}" height="150px" width="150px" class="mb-3">
                <input type="file" class="form-control" name="book_cover">
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary mb-3 mt-3" style="width:250px;">Update</button>
            </div>
        </form>
    </div>
</div>

<!-- ================= VALIDATION SCRIPT ================= -->
<script>
    document.addEventListener('DOMContentLoaded',function(){

        const err_booktitle     = document.getElementById('err_booktitle');
        const err_bookauthor    = document.getElementById('err_bookauthor');
        const err_bookprice     = document.getElementById('err_bookprice');
        const err_bookpublisher = document.getElementById('err_bookpublisher');
        const err_bookdesc      = document.getElementById('err_bookdesc');

        /* BOOK TITLE */
        window.Validationbooktitle=function(){
            err_booktitle.innerHTML =
            /^[A-Za-z0-9\s.-]+$/.test(myform.book_title.value.trim())
            ? "" : "Only letters, numbers, spaces, dot and hyphen allowed";
        }

        window.Validationbookauthor=function(){
            err_bookauthor.innerHTML =
            /^[A-Z][a-z]+(\s([A-Z][a-z]+|[A-Z](\.[A-Z])?\.?))*$/
            .test(myform.book_author.value.trim())
            ? "" : "Enter a valid author name";
        }

        /* PRICE */
        window.Validationbookprice=function(){
            err_bookprice.innerHTML =
            /^[0-9]+$/.test(myform.book_price.value.trim())
            ? "" : "Price must contain numbers only";
        }

        /* PUBLISHER */
        window.Validationpublisher=function(){
            err_bookpublisher.innerHTML =
            /^[A-Za-z\s]+$/.test(myform.book_publisher.value.trim())
            ? "" : "Publisher name must contain letters only";
        }

        /* DESCRIPTION */
        window.Validationdescription=function(){
            err_bookdesc.innerHTML =
            /^[A-Za-z0-9\s]+$/.test(myform.book_description.value.trim())
            ? "" : "No special characters allowed";
        }

        /* FINAL FORM VALIDATION */
        window.Validations=function(){

            Validationbooktitle();
            Validationbookauthor();
            Validationbookprice();
            Validationpublisher();
            Validationdescription();

            return document.querySelectorAll('.text-danger:not(:empty)').length === 0;
        }

    });
</script>

<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

{% if messages %}
{% for i in messages %}
{% if 'success' in i.tags %}
<script> swal('{{i}}', '', 'success'); </script>

{% elif 'warning' in i.tags %}
<script> swal('{{i}}', '', 'warning'); </script>

{% elif 'info' in i.tags %}
<script> swal('{{i}}', '', 'info'); </script>

{% elif 'error' in i.tags %}
<script> swal('{{i}}', '', 'error'); </script>

{% endif %}
{% endfor %}
{% endif %}

{% endblock %}
